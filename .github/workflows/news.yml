name: Update News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Get Firestore access token
        id: firestore-token
        run: echo "token=$(gcloud auth print-access-token)" >> "$GITHUB_OUTPUT"

      - name: Sync feedback from Firestore
        env:
          FIREBASE_PROJECT_ID: newsbrief-ai-27bd5
          FIRESTORE_ACCESS_TOKEN: ${{ steps.firestore-token.outputs.token }}
        run: python src/sync_feedback.py

      - name: Collect news
        run: python src/fetch_news.py

      - name: Validate generated JSON
        run: python -m json.tool data/news.json > /dev/null

      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update news feed"
            git push
          fi
